<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="The learning loop: record, flag, lesson, promote (you approve), measure">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#B07A2A"/>
    </marker>
    <marker id="arrowc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#5CE1FF"/>
    </marker>
  </defs>
  <rect width="1200" height="380" rx="16" fill="#101012"/>

  <g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace">
    <text x="40" y="52" fill="#B07A2A" font-size="15" letter-spacing="4">「 THE LEARNING LOOP 」</text>

    <!-- step boxes: x = 40, 270, 500, 730, 960 ; width 200 -->
    <g>
      <rect x="40" y="96" width="200" height="150" rx="10" fill="#17140F" stroke="#B07A2A" stroke-width="2"/>
      <text x="60" y="130" fill="#B07A2A" font-size="14">01</text>
      <text x="60" y="160" fill="#F2B84B" font-size="24" font-weight="700">RECORD</text>
      <text x="60" y="190" fill="#FFF1D6" font-size="14">every subagent run</text>
      <text x="60" y="210" fill="#FFF1D6" font-size="14">to a per-session</text>
      <text x="60" y="230" fill="#FFF1D6" font-size="14">ledger file</text>
    </g>
    <g>
      <rect x="270" y="96" width="200" height="150" rx="10" fill="#17140F" stroke="#B07A2A" stroke-width="2"/>
      <text x="290" y="130" fill="#B07A2A" font-size="14">02</text>
      <text x="290" y="160" fill="#F2B84B" font-size="24" font-weight="700">FLAG</text>
      <text x="290" y="190" fill="#FFF1D6" font-size="14">fixed rules: tiny,</text>
      <text x="290" y="210" fill="#FFF1D6" font-size="14">heavy, loop, stuck,</text>
      <text x="290" y="230" fill="#FFF1D6" font-size="14">verify-fail …</text>
    </g>
    <g>
      <rect x="500" y="96" width="200" height="150" rx="10" fill="#17140F" stroke="#B07A2A" stroke-width="2"/>
      <text x="520" y="130" fill="#B07A2A" font-size="14">03</text>
      <text x="520" y="160" fill="#F2B84B" font-size="24" font-weight="700">LESSON</text>
      <text x="520" y="190" fill="#FFF1D6" font-size="14">2 strikes in 30 d</text>
      <text x="520" y="210" fill="#FFF1D6" font-size="14">make a candidate,</text>
      <text x="520" y="230" fill="#FFF1D6" font-size="14">1 strike is noise</text>
    </g>
    <g>
      <rect x="730" y="96" width="200" height="150" rx="10" fill="#0E1C20" stroke="#5CE1FF" stroke-width="2"/>
      <text x="750" y="130" fill="#5CE1FF" font-size="14">04</text>
      <text x="750" y="160" fill="#5CE1FF" font-size="24" font-weight="700">PROMOTE</text>
      <text x="750" y="190" fill="#E9FBFF" font-size="14">you press Approve:</text>
      <text x="750" y="210" fill="#E9FBFF" font-size="14">memory + one rule</text>
      <text x="750" y="230" fill="#E9FBFF" font-size="14">line in your files</text>
    </g>
    <g>
      <rect x="960" y="96" width="200" height="150" rx="10" fill="#17140F" stroke="#B07A2A" stroke-width="2"/>
      <text x="980" y="130" fill="#B07A2A" font-size="14">05</text>
      <text x="980" y="160" fill="#F2B84B" font-size="24" font-weight="700">MEASURE</text>
      <text x="980" y="190" fill="#FFF1D6" font-size="14">flag rate before</text>
      <text x="980" y="210" fill="#FFF1D6" font-size="14">vs after; revert</text>
      <text x="980" y="230" fill="#FFF1D6" font-size="14">if not helping</text>
    </g>

    <!-- forward arrows -->
    <g stroke="#B07A2A" stroke-width="2" fill="none">
      <line x1="242" y1="171" x2="266" y2="171" marker-end="url(#arrow)"/>
      <line x1="472" y1="171" x2="496" y2="171" marker-end="url(#arrow)"/>
      <line x1="702" y1="171" x2="726" y2="171" marker-end="url(#arrowc)" stroke="#5CE1FF"/>
      <line x1="932" y1="171" x2="956" y2="171" marker-end="url(#arrow)"/>
    </g>

    <!-- return path -->
    <path d="M1060 248V300H140V252" fill="none" stroke="#B07A2A" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <text x="600" y="326" text-anchor="middle" fill="#B07A2A" font-size="14">the next sessions keep recording — the metric tells whether the rule worked</text>

    <!-- recall badge -->
    <rect x="500" y="270" width="200" height="0" fill="none"/>
    <text x="1160" y="52" text-anchor="end" fill="#B07A2A" font-size="13">open lessons are injected into the next prompt</text>
  </g>
<style>.fx .h{fill:var(--k,#F2B84B);opacity:.28}.fx .c{fill:var(--k,#F2B84B)}.fx .pko .h{opacity:.14}.fx .pko .c{opacity:.6}.fx .eg{fill:none;stroke:#F2B84B;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.fx .ego{fill:none;stroke:#F2B84B;stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round}.fx .bx{fill:none;stroke:#F2B84B;stroke-width:2.5}.fx .rg{fill:none;stroke:#F2B84B;stroke-width:1.5}@keyframes march{to{stroke-dashoffset:-11}}@media (prefers-reduced-motion:reduce){.fx *{animation:none!important}}@keyframes b1{0%{opacity:0}1.33%{opacity:0.7}5.56%{opacity:0.7}11.11%{opacity:0}100%{opacity:0}}.b1{animation:b1 9.0s ease-in-out infinite}@keyframes e2{0%{opacity:0}6.67%{opacity:0}8%{opacity:0.45}11.11%{opacity:0.45}15%{opacity:0}100%{opacity:0}}.e2{animation:e2 9.0s linear infinite}@keyframes p3{0%{opacity:0;transform:translate(242px,171px)}6.67%{opacity:0;transform:translate(242px,171px)}8%{opacity:1}9.78%{opacity:1}11.11%{transform:translate(266px,171px);opacity:0}100%{opacity:0;transform:translate(266px,171px)}}.p3{animation:p3 9.0s linear infinite}@keyframes b4{0%{opacity:0}11.11%{opacity:0}12.44%{opacity:0.7}16.67%{opacity:0.7}22.22%{opacity:0}100%{opacity:0}}.b4{animation:b4 9.0s ease-in-out infinite}@keyframes e5{0%{opacity:0}18.89%{opacity:0}20.22%{opacity:0.45}23.33%{opacity:0.45}27.22%{opacity:0}100%{opacity:0}}.e5{animation:e5 9.0s linear infinite}@keyframes p6{0%{opacity:0;transform:translate(472px,171px)}18.89%{opacity:0;transform:translate(472px,171px)}20.22%{opacity:1}22%{opacity:1}23.33%{transform:translate(496px,171px);opacity:0}100%{opacity:0;transform:translate(496px,171px)}}.p6{animation:p6 9.0s linear infinite}@keyframes b7{0%{opacity:0}23.33%{opacity:0}24.67%{opacity:0.7}28.89%{opacity:0.7}34.44%{opacity:0}100%{opacity:0}}.b7{animation:b7 9.0s ease-in-out infinite}@keyframes e8{0%{opacity:0}31.11%{opacity:0}32.44%{opacity:0.45}35.56%{opacity:0.45}39.44%{opacity:0}100%{opacity:0}}.e8{animation:e8 9.0s linear infinite}@keyframes p9{0%{opacity:0;transform:translate(702px,171px)}31.11%{opacity:0;transform:translate(702px,171px)}32.44%{opacity:1}34.22%{opacity:1}35.56%{transform:translate(726px,171px);opacity:0}100%{opacity:0;transform:translate(726px,171px)}}.p9{animation:p9 9.0s linear infinite}@keyframes b10{0%{opacity:0}35.56%{opacity:0}36.89%{opacity:0.7}45.56%{opacity:0.7}51.11%{opacity:0}100%{opacity:0}}.b10{animation:b10 9.0s ease-in-out infinite}@keyframes e11{0%{opacity:0}47.78%{opacity:0}49.11%{opacity:0.45}52.22%{opacity:0.45}56.11%{opacity:0}100%{opacity:0}}.e11{animation:e11 9.0s linear infinite}@keyframes p12{0%{opacity:0;transform:translate(932px,171px)}47.78%{opacity:0;transform:translate(932px,171px)}49.11%{opacity:1}50.89%{opacity:1}52.22%{transform:translate(956px,171px);opacity:0}100%{opacity:0;transform:translate(956px,171px)}}.p12{animation:p12 9.0s linear infinite}@keyframes b13{0%{opacity:0}52.22%{opacity:0}53.56%{opacity:0.7}57.78%{opacity:0.7}63.33%{opacity:0}100%{opacity:0}}.b13{animation:b13 9.0s ease-in-out infinite}@keyframes e14{0%{opacity:0}62.22%{opacity:0}63.56%{opacity:0.35}88.89%{opacity:0.35}92.78%{opacity:0}100%{opacity:0}}.e14{animation:e14 9.0s linear infinite,march .8s linear infinite}@keyframes p15{0%{opacity:0;transform:translate(1060px,248px)}62.22%{opacity:0;transform:translate(1060px,248px)}63.56%{opacity:1}63.58%{transform:translate(1060px,300px)}87.56%{opacity:1}87.63%{transform:translate(140px,300px)}88.89%{transform:translate(140px,252px);opacity:0}100%{opacity:0;transform:translate(140px,252px)}}.p15{animation:p15 9.0s linear infinite}@keyframes b16{0%{opacity:0}88.89%{opacity:0}90.22%{opacity:0.7}94.44%{opacity:0.7}100%{opacity:0}}.b16{animation:b16 9.0s ease-in-out infinite}</style>
<g class="fx" aria-hidden="true"><rect class="bx b1" opacity="0" x="40" y="96" width="200" height="150" rx="10"/><path class="eg e2" d="M242,171 L266,171" opacity="0"/><g class="pk p3" opacity="0"><circle r="7" class="h"/><circle r="3.5" class="c"/></g><rect class="bx b4" opacity="0" x="270" y="96" width="200" height="150" rx="10"/><path class="eg e5" d="M472,171 L496,171" opacity="0"/><g class="pk p6" opacity="0"><circle r="7" class="h"/><circle r="3.5" class="c"/></g><rect class="bx b7" opacity="0" x="500" y="96" width="200" height="150" rx="10"/><path class="eg e8" d="M702,171 L726,171" opacity="0" style="stroke:#5CE1FF"/><g class="pk p9" opacity="0" style="--k:#5CE1FF"><circle r="7" class="h"/><circle r="3.5" class="c"/></g><rect class="bx b10" opacity="0" style="stroke:#5CE1FF" x="730" y="96" width="200" height="150" rx="10"/><path class="eg e11" d="M932,171 L956,171" opacity="0"/><g class="pk p12" opacity="0"><circle r="7" class="h"/><circle r="3.5" class="c"/></g><rect class="bx b13" opacity="0" x="960" y="96" width="200" height="150" rx="10"/><path class="ego e14" d="M1060,248 L1060,300 L140,300 L140,252" opacity="0"/><g class="pko p15" opacity="0"><circle r="7" class="h"/><circle r="3.5" class="c"/></g><rect class="bx b16" opacity="0" x="40" y="96" width="200" height="150" rx="10"/></g>
</svg>
