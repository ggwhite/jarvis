<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="J.A.R.V.I.S. — a live HUD for Claude Code">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F2B84B" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E9FBFF"/>
      <stop offset="35%" stop-color="#5CE1FF"/>
      <stop offset="100%" stop-color="#5CE1FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5CE1FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5CE1FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0%" stop-color="#F2B84B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F2B84B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F2B84B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="18" fill="#101012"/>
  <rect width="1280" height="420" rx="18" fill="url(#grid)"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="#B07A2A" stroke-width="3" stroke-linecap="square">
    <path d="M28 70V28H70"/>
    <path d="M1210 28H1252V70"/>
    <path d="M28 350V392H70"/>
    <path d="M1252 350V392H1210"/>
  </g>

  <!-- Arc reactor -->
  <g transform="translate(250 210)">
    <circle r="150" fill="url(#glow)"/>
    <circle r="118" fill="none" stroke="#B07A2A" stroke-width="2"/>
    <circle r="104" fill="none" stroke="#F2B84B" stroke-width="10" stroke-dasharray="34 10" stroke-opacity="0.9"/>
    <circle r="84" fill="none" stroke="#4A3418" stroke-width="2"/>
    <g stroke="#F2B84B" stroke-width="6" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="-74" x2="0" y2="-50"/>
      <line x1="64" y1="-37" x2="43" y2="-25"/>
      <line x1="64" y1="37" x2="43" y2="25"/>
      <line x1="0" y1="74" x2="0" y2="50"/>
      <line x1="-64" y1="37" x2="-43" y2="25"/>
      <line x1="-64" y1="-37" x2="-43" y2="-25"/>
    </g>
    <circle r="46" fill="none" stroke="#5CE1FF" stroke-width="3" stroke-opacity="0.8"/>
    <circle r="40" fill="url(#core)"/>
    <path d="M0 -26L22.5 13L-22.5 13Z" fill="none" stroke="#101012" stroke-width="3" stroke-opacity="0.55"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace">
    <text x="470" y="118" fill="#B07A2A" font-size="20" letter-spacing="6">「 CLAUDE CODE MOD 」</text>
    <text x="466" y="208" fill="#F2B84B" font-size="92" font-weight="700" letter-spacing="10">J.A.R.V.I.S.</text>
    <rect x="470" y="232" width="690" height="2" fill="url(#fade)"/>
    <text x="470" y="276" fill="#FFF1D6" font-size="24">A live HUD beside the chat. Subagents, cost,</text>
    <text x="470" y="308" fill="#FFF1D6" font-size="24">changes, the fleet — and a loop that learns.</text>

    <!-- tab pills -->
    <g font-size="15" letter-spacing="1">
      <g transform="translate(470 336)">
        <rect width="62" height="28" rx="4" fill="none" stroke="#4A3418"/><text x="31" y="19" text-anchor="middle" fill="#F2B84B">NOW</text>
        <rect x="72" width="84" height="28" rx="4" fill="none" stroke="#4A3418"/><text x="114" y="19" text-anchor="middle" fill="#F2B84B">EVENTS</text>
        <rect x="166" width="72" height="28" rx="4" fill="none" stroke="#4A3418"/><text x="202" y="19" text-anchor="middle" fill="#F2B84B">STATS</text>
        <rect x="248" width="72" height="28" rx="4" fill="none" stroke="#4A3418"/><text x="284" y="19" text-anchor="middle" fill="#F2B84B">FLEET</text>
        <rect x="330" width="96" height="28" rx="4" fill="none" stroke="#4A3418"/><text x="378" y="19" text-anchor="middle" fill="#F2B84B">CHANGES</text>
        <rect x="436" width="72" height="28" rx="4" fill="none" stroke="#4A3418"/><text x="472" y="19" text-anchor="middle" fill="#F2B84B">TASKS</text>
        <rect x="518" width="96" height="28" rx="4" fill="#5CE1FF"/><text x="566" y="19" text-anchor="middle" fill="#101012" font-weight="700">LESSONS</text>
      </g>
    </g>

    <text x="1210" y="60" text-anchor="end" fill="#F2B84B" font-size="16" letter-spacing="3">● ALL SYSTEMS NOMINAL</text>
  </g>
</svg>
